
name: INJECT M APK Builder

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Instalar Gradle
        run: |
          wget https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip

      - name: Extrair projeto
        run: |
          mkdir INJECT-M-Projeto
          unzip -q INJECT-M-Projeto.zip -d INJECT-M-Projeto

      - name: Compilar APK
        run: |
          cd INJECT-M-Projeto
          ../gradle-8.7/bin/gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: INJECT-M-APK
          path: INJECT-M-Projeto/app/build/outputs/apk/debug/*.apk
